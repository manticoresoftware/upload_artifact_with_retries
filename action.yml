name: 'Upload artifact with retries'
description: 'Upload an artifact once and retry download verification if it is not immediately available'
inputs:
  name:
    required: true
    type: string
  path:
    required: true
    type: string
runs:
  using: "composite"
  steps:
    - name: Tar # this step is important to preserve artifact permissions, without tar'ing they are lost
      id: tar
      run: |
        shopt -s globstar
        find ${{ inputs.path }} -type f -print0 | xargs -0 tar -cvf artifact.tar || true
        ls -la artifact.tar
      shell: bash
    # Artifact names are immutable. Retrying an upload after a successful upload
    # but failed verification causes a 409 Conflict.
    - name: Upload artifact
      id: upload
      uses: actions/upload-artifact@v6
      with:
        name: ${{ inputs.name }}
        path: artifact.tar
        if-no-files-found: error
    - name: Download artifact (attempt 1)
      id: download1
      uses: actions/download-artifact@v7
      continue-on-error: true
      with:
        artifact-ids: ${{ steps.upload.outputs.artifact-id }}
        path: ${{ runner.temp }}/artifact-check-${{ steps.upload.outputs.artifact-id }}
    - name: Wait before retrying download
      if: steps.download1.outcome == 'failure'
      shell: bash
      run: sleep 5
    - name: Download artifact (attempt 2)
      id: download2
      if: steps.download1.outcome == 'failure'
      uses: actions/download-artifact@v7
      continue-on-error: true
      with:
        artifact-ids: ${{ steps.upload.outputs.artifact-id }}
        path: ${{ runner.temp }}/artifact-check-${{ steps.upload.outputs.artifact-id }}
    - name: Wait before final download attempt
      if: steps.download2.outcome == 'failure'
      shell: bash
      run: sleep 10
    - name: Download artifact (attempt 3)
      id: download3
      if: steps.download2.outcome == 'failure'
      uses: actions/download-artifact@v7
      continue-on-error: true
      with:
        artifact-ids: ${{ steps.upload.outputs.artifact-id }}
        path: ${{ runner.temp }}/artifact-check-${{ steps.upload.outputs.artifact-id }}
    - name: Verify downloaded archive
      shell: bash
      run: |
        if [[ "${{ steps.download1.outcome }}" != "success" &&
              "${{ steps.download2.outcome }}" != "success" &&
              "${{ steps.download3.outcome }}" != "success" ]]; then
          echo "::error::Uploaded artifact could not be downloaded for verification"
          exit 1
        fi
        # RUNNER_TEMP is mapped to the container filesystem for shell steps.
        downloaded_archive="$RUNNER_TEMP/artifact-check-${{ steps.upload.outputs.artifact-id }}/artifact.tar"
        if [[ ! -f "$downloaded_archive" ]]; then
          echo "::error::Downloaded artifact archive not found: $downloaded_archive"
          exit 1
        fi
        if ! cmp -s artifact.tar "$downloaded_archive"; then
          echo "::error::Downloaded artifact differs from uploaded archive"
          exit 1
        fi
